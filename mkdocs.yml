site_name: MOSAIC
site_description: A modular grid-based Search and Rescue simulation platform for studying human-AI teaming
repo_url: https://github.com/iHuman-Lab/mosaic
repo_name: iHuman-Lab/mosaic
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Game Concept: game-concept.md
  - Architecture: architecture.md
  - Core Systems: core-systems.md
  - GUI: gui.md
  - LLM Integration: llm.md
  - Experiment Framework: experiment.md
  - Configuration: configuration.md
  - Testing: testing.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

watch:
  - src/mosaic
