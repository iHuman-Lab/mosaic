site_name: MOSAIC
site_description: A modular grid-based Search and Rescue simulation platform for studying human-AI teaming
repo_url: https://github.com/iHuman-Lab/mosaic
repo_name: iHuman-Lab/mosaic
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  font:
    text: Rubik
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Game Concept: game-concept.md
  - Architecture: architecture.md
  - Core Systems: core-systems.md
  - GUI: gui.md
  - LLM Integration: llm.md
  - Experiment Framework: experiment.md
  - Configuration: configuration.md
  - Testing: testing.md
  - API Reference:
      - Overview: api/index.md
      - Environment: api/environment.md
      - Core: api/core.md
      - SAR Components: api/sar.md
      - GUI: api/gui.md
      - LLM: api/llm.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table
            summary: true
            filters: ["!^_"]

watch:
  - src/mosaic
