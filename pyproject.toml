[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihuman-mosaic"
version = "0.1.0"
description = "A modular platform for Human-AI collaboration research"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "iHuman Lab" }]
requires-python = ">=3.10"
dependencies = [
    "minigrid",
    "pygame-ce",
    "pygame_gui",
    "numpy",
    "pandas",
    "tabulate",
    "pyyaml",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/iHuman-Lab/mosaic"
Documentation = "https://ihuman-lab.github.io/mosaic"
Issues = "https://github.com/iHuman-Lab/mosaic/issues"

[project.scripts]
mosaic = "mosaic.cli:main"

[project.optional-dependencies]
experiment = ["llama_index"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["experiment", "experiment.*"]

[tool.setuptools.package-data]
"mosaic.llm" = ["prompts.yaml"]
"mosaic.gui" = ["theme.json", "compass_inv.png"]
